[package]
name = "rackip"
version = "0.4.0"
edition = "2021"
description = "Switch the static IP of an Ethernet port in one click"
license = "MIT"
repository = "https://github.com/majnioui/RackIP"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
